spring.application.name=users-service
server.port=8084

#BD propia de users-service
spring.datasource.url=jdbc:mysql://localhost:3306/bd_users
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# URLs de otros microservicios (para WebClient)
catalog-service.url=https://f0w9w4nq-8081.brs.devtunnels.ms/
orders-service.url=https://f0w9w4nq-8082.brs.devtunnels.ms/
support-service.url=https://f0w9w4nq-8083.brs.devtunnels.ms/

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ejecuta data.sql despues de que JPA cree/actualice el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

