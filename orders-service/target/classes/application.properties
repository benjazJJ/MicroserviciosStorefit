spring.application.name=orders-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/bd_orders
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

catalog-service.url=https://f0w9w4nq-8081.brs.devtunnels.ms/
users-service.url=https://f0w9w4nq-8084.brs.devtunnels.ms/
support-service.url=https://f0w9w4nq-8083.brs.devtunnels.ms/

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging extra para depurar llamadas HTTP externas (orders -> otros servicios)
logging.level.com.storefit.orders_service=INFO
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG
